name: P1 SLAMS CI/CD

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: ap-south-1
  FRONTEND_BUCKET: ${{ vars.SLAMS_FRONTEND_BUCKET }}
  CLOUDFRONT_DISTRIBUTION_ID: ${{ vars.SLAMS_CLOUDFRONT_DISTRIBUTION_ID }}

jobs:

  # ============================================================
  # BUILD
  # ============================================================
  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            Backend/package-lock.json
            Frontend/package-lock.json

      - name: Install backend dependencies
        working-directory: Backend
        run: npm ci

      - name: Install frontend dependencies
        working-directory: Frontend
        run: npm ci

      - name: Build frontend
        working-directory: Frontend
        run: npm run build

      - name: Upload frontend build artifact
        uses: actions/upload-artifact@v4
        with:
          name: slams-frontend-dist
          path: Frontend/dist
          if-no-files-found: error


  # ============================================================
  # TEST
  # ============================================================
  test:
    name: Test
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: Backend/package-lock.json

      - name: Install backend dependencies
        working-directory: Backend
        run: npm ci

      - name: Validate backend JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          for file in Backend/src/*.js Backend/scripts/*.js; do
            echo "Checking $file"
            node --check "$file"
          done

      - name: Validate Python syntax
        run: |
          python -m py_compile Backend/src/submitLeaveRequest.py

      - name: Validate Step Functions definition is valid JSON
        run: |
          node -e "JSON.parse(require('fs').readFileSync('Backend/step-functions.json', 'utf8')); console.log('step-functions.json: valid JSON')"


  # ============================================================
  # DEPLOY
  # ============================================================
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: [build, test]

    if: github.event_name != 'pull_request'

    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # --------------------------------------------------------
      # AWS OIDC
      # --------------------------------------------------------
      - name: Configure AWS credentials with GitHub OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify AWS identity
        run: aws sts get-caller-identity


      # --------------------------------------------------------
      # Node.js
      # --------------------------------------------------------
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: Backend/package-lock.json

      - name: Install backend dependencies
        working-directory: Backend
        run: npm ci


      # --------------------------------------------------------
      # Lambda Deployment
      # --------------------------------------------------------
      - name: Deploy Lambda functions
        shell: bash
        run: |
          set -euo pipefail

          functions=(
            submitLeaveRequest
            approveRejectRequest
            finalizeApprovalRequest
            reportsCalendar
            carryForwardAndSummary
            notifyManager
            notifyHRAdmin
          )

          mkdir -p .lambda-packages

          for function in "${functions[@]}"; do

            echo "Packaging $function"

            rm -rf ".lambda-packages/$function"

            mkdir -p ".lambda-packages/$function"

            cp \
              "Backend/src/$function.js" \
              ".lambda-packages/$function/index.js"

            cp -R \
              Backend/node_modules \
              ".lambda-packages/$function/node_modules"

            (
              cd ".lambda-packages/$function"
              zip -qr "../$function.zip" .
            )

            echo "Updating Lambda $function"

            aws lambda update-function-code \
              --function-name "$function" \
              --zip-file "fileb://.lambda-packages/$function.zip" \
              --publish

          done


      # --------------------------------------------------------
      # Frontend Deployment
      # --------------------------------------------------------
      - name: Download frontend artifact
        uses: actions/download-artifact@v4
        with:
          name: slams-frontend-dist
          path: Frontend/dist

      - name: Deploy frontend to S3
        if: env.FRONTEND_BUCKET != ''
        run: |
          aws s3 sync \
            Frontend/dist \
            "s3://$FRONTEND_BUCKET" \
            --delete

      - name: Invalidate CloudFront cache
        if: env.CLOUDFRONT_DISTRIBUTION_ID != ''
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "$CLOUDFRONT_DISTRIBUTION_ID" \
            --paths '/*'